name: Read Frog
extName: "Read Frog - Translate & Learn"
extDescription: Read Frog is an open source browser extension designed to help you learn languages deeply from any website.
contextMenu:
  translate: Translate
  translateSelection: Translate "%s"
  showOriginal: Show Original
popup:
  languageSelector:
    searchLanguages: Search languages...
    noLanguagesFound: No languages found
  autoLang: Auto
  sourceLang: Source
  targetLang: Target
  providers:
    title: Providers
    description: Choose which provider to use for each feature
    open: Open provider settings
  translate: Translate
  showOriginal: Show Original
  enabledFloatingButton: Enable floating button
  alwaysTranslate: Always translate this site
  addToWhitelist: Enable extension on this site
  addToBlacklist: Disable extension on this site
  options: Options
  hover: Hover
  translateParagraph: to translate paragraph
