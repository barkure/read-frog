errorRecovery:
  title: Something went wrong
  description: Recovery mode is active. You can export your current settings as a backup, then reset settings and try again.
  backupTitle: Backup current settings first (recommended)
  exportWithApiKeys: Export with API Keys
  exportWithoutApiKeys: Export without API Keys
  recoveryTitle: Recovery options
  refreshPage: Refresh the page
  resetAction: Reset to default settings
  resetSuccess: Recovery completed. Settings have been reset
  resetFailed: Recovery failed. Unable to reset settings
  errorDetails: Error details
  resetDialog:
    title: Reset settings?
    description: This will replace your current settings with the default values.
    confirm: Reset
    cancel: Cancel
options:
  autosave:
    invalid: Please correct the highlighted fields before leaving.
    failed: Your changes could not be saved. They are still available here.
    deleted: This item was deleted elsewhere. Your unsaved edits have been kept.
    retry: Retry
    leaveTitle: Changes have not been saved
    leaveDescription: Continue editing to fix the problem, or discard the changes that have not been saved.
    keepEditing: Continue editing
    discard: Discard unsaved changes
  batchSavings:
    savedCost: Saved approx. $1% on API costs
  commandPalette:
    placeholder: Search settings...
    noResults: No settings found
    open: Search settings
  sidebar:
    toggle: Toggle sidebar
    settings: Settings
    features: Features
    translation: Translation
    product: Product
  apiProviders:
    title: API Providers
    pageDescription: Connect the AI services Read Frog calls, then choose which one runs each feature.
    configTitle: Provider config
    setApiKeyWarning:
      message: Please set your API key on the $1 page
    form:
      fields:
        baseURL: Base URL
        optional: Optional
      models:
        translate:
          placeholder: Select a model
        label: Model
        enterCustomModel: Enter the name of the custom model
    providers:
      description:
        deepseek: DeepSeek-V4.1-Flash and DeepSeek-V4-Pro, called with your own API key
    apiKey:
      showAPIKey: Show API key
    testConnection:
      button: Test connection
      testing: Testing...
      success: Success
      failed: Failed
      slow: Slow (try adjusting thinking mode)
    featureProviders:
      title: Feature providers
      description: Choose which provider to use for each feature
      features:
        pageTranslation: Page translation
        selectionTranslation: Selection toolbar translation
        inputTranslation: Input translation
        videoSubtitles: Video subtitles
      descriptions:
        pageTranslation: Translates the whole page in bilingual or replace mode.
        selectionTranslation: Translates the text you select from the selection toolbar.
        inputTranslation: Translates what you type into an input box before you send it.
        videoSubtitles: Translates subtitles as they appear in a video player.
    languageDetection:
      title: Language detection
      description: Affects auto-translate language detection and Speaking voice selection accuracy.
      mode:
        basic: Basic
        llm: LLM
      provider:
        label: Detection provider
        placeholder: Select a provider
      status:
        noProviders: Configure an LLM provider first
        basicRecommend: Recommend enabling LLM
        llmEnabled: LLM detection enabled
    aiContentAware:
      title: AI smart context translation
      description: Give the AI context from the page or video so it translates more accurately
      enable: Enable
      enableDescription: The AI reads a summary of the page or video before translating, so wording fits the context. Applies to every translation feature running on an LLM provider. Adds latency on the first request and increases API costs.
  patterns:
    duplicate: This pattern is already in the list
    gluedWildcard: A "*" has to stand for a whole part of the address, like *.example.com or example.*
    unsupported: Read Frog cannot match this address. Ports and schemes other than http and https are not supported.
  preference:
    title: Preferences
    pageDescription: Set how Read Frog looks, where it runs, and how your config is synced and backed up.
    appearanceAndLanguage:
      title: Appearance & language
      theme:
        title: Theme
        description: Choose a theme for Read Frog.
        system: System
        light: Light
        dark: Dark
      interfaceLanguage:
        title: Interface language
        description: Choose the language for the extension's interface, independent of your browser language.
        auto: Auto (follow browser)
    translationLanguage:
      title: Translation languages
      sourceCode:
        title: Source language
        description: The language pages are translated from. Auto-detect reads it from the page itself.
        auto: Auto-detect
      targetCode:
        title: Target language
        description: The language pages are translated into.
    extensionActivation:
      title: Extension activation
      description: Whether Read Frog runs everywhere except the sites you list, or only on the sites you list
      manageSites: Manage sites
      mode:
        title: Activation mode
        description: Use blacklist mode to disable the extension on specific sites, or whitelist mode to limit it to specific sites only.
        blacklist: Only disable on listed sites
        whitelist: Only run on listed sites
      patterns:
        enterUrlPattern: Enter URL pattern (e.g., example.com)
        urlPattern: URL Pattern
    config:
      title: Config
      manualSync:
        title: Manual config sync
        description: Manually import and export your configuration settings, and your glossaries with them
        import: Import
        export: Export
        importSuccess: Config imported successfully
        exportSuccess: Config exported successfully
        importError: Import failed
        exportOptions:
          title: Select export options
          description: Please choose whether to include API Keys in the exported config. Including API Keys may leak sensitive information, so it's recommended to use only in secure environments.
          includeAPIKeys: Include API keys
          excludeAPIKeys: Exclude API keys
          cancel: Cancel
      viewConfig:
        open: Open config
        title: Config
        description: View the raw JSON of your current configuration
      reset:
        title: Reset config
        description: Reset all config to default value. Your glossaries are not affected.
        dialog:
          title: Reset config
          trigger: Reset config
          confirm: Confirm
          cancel: Cancel
          description: This operation will clear all your custom configurations and reset them to default values. Please confirm.
  shortcuts:
    title: Shortcuts
    pageDescription: Set the keys that trigger translation while you read.
    setShortcut: Set shortcut
    pageTranslation:
      title: Page translation
      description: Translate the whole page.
    translationMode:
      title: Translation mode
      description: Switch between bilingual and translation only.
    selectionTranslation:
      title: Selection translation
      description: Translate the text you selected.
    subtitlesToggle:
      title: Subtitle translation
      description: Turn translated video subtitles on or off.
    nodeTranslation:
      title: Paragraph translation
      description: Hover or long-press a paragraph to translate just that one.
  overlayTools:
    title: Overlay Tools
  inputTranslation:
    title: Input Translation
    pageDescription: Translate what you type in input boxes before you send it.
    trigger:
      title: Trigger
      enable:
        title: Enable
        description: Press the space bar three times quickly in any input box to translate what you typed there.
      threshold:
        title: Trigger threshold
        description: How long the presses may be apart, in milliseconds. Raise it if the trigger keeps missing, lower it if it fires while you are still typing.
        error: Enter a value between $1 and $2
    languages:
      title: Translation languages
      pair:
        title: Language pair
        description: What the typed text is read as, and what it is translated into. Either side can follow the source and target languages you translate pages with.
      sourceCode: Page source language
      targetCode: Translation target language
      cycle:
        title: Swap direction each time
        description: Every trigger swaps the two languages, so triggering again brings the text back to the language you typed in.
  floatingButton:
    title: Floating Button
    pageDescription: Set which side the floating button sits on, what a click does, and where it stays hidden.
    demoImageAlt: Floating button demo
    enable:
      title: Enable floating button
      description: Display the floating button on web pages for quick access to Read Frog features
    display:
      title: Display
      side:
        title: Button side
        description: Choose which side of the page the floating button is docked to
        left: Left
        right: Right
      disabledSites:
        title: Disabled sites
        description: Configure websites where the floating button should be disabled
        enterUrlPattern: Enter URL pattern
        urlPattern: URL pattern
    closeMenu:
      disableForSite: Disable for this site
      disableGlobally: Disable globally
    tooltips:
      togglePageTranslation: Toggle page translation
      floatingButtonOptions: Floating button options
      lockPosition: Lock position
      unlockPosition: Unlock position
      settings: Settings
      feedback: Send feedback
  selectionToolbar:
    title: Selection Toolbar
    pageDescription: Set which actions appear when you select text, and where the toolbar shows up.
    demoImageAlt: Selection toolbar demo
    enable:
      title: Enable selection toolbar
      description: Display the toolbar when selecting text on web pages for quick translation, speech, and AI actions
    actions:
      title: Actions
      translate:
        title: Translate
        description: Show the translate button in the toolbar
    display:
      title: Display
      opacity:
        title: Opacity
        description: Adjust the opacity of the selection toolbar and the expanded window opened from it
      disabledSites:
        title: Disabled sites
        description: Configure websites where the selection toolbar should be disabled
        enterUrlPattern: Enter URL pattern
        urlPattern: URL pattern
    closeMenu:
      disableForSite: Disable for this site
      disableGlobally: Disable globally
    errors:
      actionUnavailable: Selected action is unavailable
      missingSelection: No selected text available
      providerDisabled: Selected provider is disabled
      providerUnavailable: Selected provider is unavailable
  contextMenu:
    title: Context Menu
    pageDescription: Control the Read Frog entries in the browser's right-click menu.
    demoImageAlt: Context menu demo
    enable:
      title: Enable context menu translate
      description: Add translate options to the browser right-click menu for quick page and selection translation
  translation:
    title: Page Translation
    pageDescription: Control how pages get translated — mode, range, prompts, and request limits.
    preference:
      title: Basics
      translationMode:
        title: Translation mode
        description: "Choose how the translated text is displayed: bilingual or translation only."
        mode:
          bilingual: Bilingual
          translationOnly: Translation only
        switched: "Translation mode: $1"
        providerNotSupported: $1 doesn't support translation-only mode. To enable it, switch to another provider.
      translateRange:
        title: Translation range
        description: Select whether to translate only the main content or all content on the page.
        range:
          main: Main content
          all: All content
    hoverTranslation:
      title: Hover translation
      enable:
        title: Enable
        description: Hover or long-press a paragraph to translate just that one.
      forceRetranslation:
        title: Always request a fresh translation
        description: Hover translation skips the cache — it re-translates even if the text is already cached, and overwrites the cached result.
    translationStyle:
      title: Translation display style
      description: Set any style you want to distinguish translation results from original text
      useCustomStyle: Use custom CSS style
      useCustomStyleDescription: Supports any CSS, including fonts, animations, and language-specific styles
      presetStyle: Preset style
      cssEditor: CSS editor
      cssEditorDescription: Write your own CSS and preview how translated text looks.
      preview: Preview
      stylePreviewLanguage: Language
      stylePreviewDirection: Direction
      stylePreviewTranslatedText: Translated text
      style:
        default: None
        blur: Blur effect
        blockquote: Blockquote
        weakened: Weakened
        dashedLine: Dashed line
        border: Border
        textColor: Text color
        background: Background
      customCSS:
        editor:
          placeholder: |
            /* Example: Custom style with color and background */
            [data-read-frog-custom-translation-style='custom'] {
              color: #414535;
              background-color: light-dark(#F2E3BC, #C19875);
              padding: 2px 4px;
              border-radius: 4px;
            }
          saveButton: Save
          savedButton: Saved
          validation:
            validating: Validating...
            valid: CSS is valid
            syntaxError: CSS has syntax errors
            tooLong: CSS is too long
            saved: All changes saved
    personalizedPrompts:
      title: Customize page prompts
      description: Customizing different types of Prompts allows you to adjust the Prompt type yourself during translation. A Prompt represents the text that the user sends to the LLM.
      managePrompts: Manage prompts
      addPrompt: Add prompt
      default: Default
      builtIn: Built-in
      copyAndCustomize: Copy and customize
      copyName: "$1 copy"
      builtInPrompts:
        default:
          description: Balanced, reliable translation for everyday content
        precisionRewrite:
          name: Polished rewrite
          description: More idiomatic, colloquial translations; slightly higher token usage
      importSuccess: Import success
      import: Import
      export: Export
      current: in use
      editPrompt:
        title: Edit prompt
        name: Name
        systemPrompt: System prompt
        prompt: Prompt
        promptCellInput:
          input: Text content to translate
          targetLanguage: Target language
          webTitle: Webpage title
          webDescription: Webpage description from page metadata
          webContent: Webpage content (truncated to the first 2000 characters)
          webSummary: Webpage summary (requires AI smart context)
        save: Save changes
        close: Cancel
      deletePrompt:
        title: Delete prompt
        description: Confirm delete prompt
        confirm: Confirm
        cancel: Cancel
      exportPrompt:
        exportSelected: Export selected
        cancel: Cancel
    translationControl:
      title: Translation control
      description: What starts translating on its own, what never does, and what gets skipped
      manageControls: Manage controls
      autoTranslateWebsite:
        title: Auto translate based on website
        description: Sites that start translating as soon as they open
        urlPattern: URL pattern
        enterUrlPattern: Enter URL pattern
      neverAutoTranslateWebsite:
        title: Never auto translate based on website
        description: Sites that never translate on their own, even when a language rule matches
        urlPattern: URL pattern
        enterUrlPattern: Enter URL pattern
      autoTranslateLanguages:
        title: Auto translate based on language
        description: Automatically translate page content when specific languages are detected
        selectLanguages: Select languages
      skipLanguages:
        title: Auto skip based on language
        description: Automatically skip paragraph translation when specific languages are detected
        targetLanguageSkipDescription: Skip paragraphs already in the target language, without sending a request
        selectLanguages: Select languages
      smallParagraphFilter:
        title: Small paragraph filter
        description: These global defaults skip translating text nodes with fewer characters or words than the thresholds. Matching site rules can override them (0 = disabled)
        minCharacters:
          description: "Minimum characters: shorter text stays untranslated. Use 0 to translate everything"
        minWords:
          description: "Minimum words: text with fewer words stays untranslated"
        error: Value must be between $1 and $2
    translationQueue:
      title: Translation queue
      description: How fast requests go out, how much text each carries, and how far ahead of the reader they run
      manageQueue: Manage queue
      requestQueueConfig:
        title: Translation rate
        capacity:
          description: "Maximum burst requests: how many can go out at once"
        rate:
          description: "Requests per second: the steady pace after a burst. Decimals work, so 0.25 sends one request every 4 seconds"
      batchQueueConfig:
        title: Batch translation
        description: Configure character limits and maximum paragraph count for batch translation (only effective for LLM translation)
        maxCharactersPerBatch:
          description: "Maximum characters: how much text one AI request carries"
        maxItemsPerBatch:
          description: "Maximum paragraphs: how many paragraphs share one request. Providers that are not AI ignore both"
      preloadConfig:
        title: Pre-translate range
        description: Control how much content below the viewport gets pre-translated to save API costs
        margin:
          description: "Preload distance: how far below the screen to translate ahead, in pixels. Less saves API cost"
        threshold:
          description: "Visibility threshold: how much of a paragraph must be on screen before it is translated, from 0 to 1"
    cache:
      title: Cache
      clearCache:
        title: Clear cache
        description: Clear all translation cache in your browser
        clearing: Clearing...
        dialog:
          title: Clear cache
          trigger: Clear cache
          confirm: Confirm
          cancel: Cancel
          description: This operation will clear all translation cache. This action cannot be undone.
  siteRules:
    title: Site rules
    description: Per-site rules that adjust how specific websites are translated.
    userRules:
      title: User Rules
      description: Define your own site rules as a JSON array. Rules apply to pages whose URL matches their patterns; user rules take precedence over built-in rules.
      saveButton: Save
      savedButton: Saved
      validation:
        validating: Validating...
        valid: Rules are valid
        syntaxError: JSON has syntax errors
        notArray: The top-level JSON value must be an array of rules
        tooLong: Rules document is too long
        tooMany: Too many rules
        duplicateIds: Duplicate rule ids
        schemaErrors: Some rules are invalid
        moreErrors: ...and $1 more errors
        saved: All changes saved
    builtIn:
      title: Built-in Rules
      description: Site rules shipped with the extension. Disable a rule with its switch if it causes problems on a site.
      searchPlaceholder: Search by id, description, or URL pattern
      showMore: Show more
      count: Showing $1 of $2 rules
  videoSubtitles:
    title: Video Subtitles
    pageDescription: Translate subtitles as you watch, with their own provider, style, and request settings.
    preference:
      title: Basics
      enable:
        title: Enable video subtitles
        description: Puts a translate button in the video player's controls. YouTube only, for now.
      autoStart:
        title: Translate on open
        description: Start translating as soon as a video loads, without pressing the button.
      aiSegmentation:
        title: AI smart segmentation
        description: Lets AI re-cut the subtitles into lines that read as sentences. It sets their timing too, so lines can drift out of sync. Needs an LLM translation provider.
    style:
      title: Subtitle style
      description: Display mode, position, fonts, colors and background, set against a live preview
      customizeStyle: Customize style
      displayMode:
        title: Display mode
        bilingual: Bilingual
        originalOnly: Original only
        translationOnly: Translation only
      translationPosition:
        title: Translation position
        above: Above
        below: Below
      generalSettings: General
      mainSubtitle: Main subtitle
      translationSubtitle: Translation subtitle
      fontFamily: Font
      fontScale: Font scale
      color: Color
      fontWeight: Font weight
      backgroundOpacity: Background opacity
      reset: Reset to default
      customCSS:
        title: Custom CSS
        description: Extra CSS for the subtitle lines, on top of the fonts and colors above
        presetTemplate: Preset template
        presetTemplateDescription: Apply a ready-made template — such as blurring the translation to cover it while you train your listening
        presetPlaceholder: Choose a template
        presets:
          blurTranslation: Blur translation
          dashedTranslation: Dashed translation
          dimOriginal: Dim original
        editor:
          placeholder: |
            /* Example: blur the translation, and reveal it on hover */
            .subtitles-translation {
              filter: blur(6px);
            }

            .subtitles-translation:hover {
              filter: none;
            }

            /* Selectors you can use: .read-frog-subtitles-box, .subtitles-main, .subtitles-translation */
          saveButton: Save
          savedButton: Saved
          validation:
            validating: Validating...
            valid: CSS is valid
            syntaxError: CSS has syntax errors
            tooLong: CSS is too long
            saved: All changes saved
    customPrompts:
      title: Custom subtitle prompts
      description: Prompt templates for subtitle translation, kept apart from the webpage translation ones
      managePrompts: Manage prompts
      editPrompt:
        promptCellInput:
          input: Subtitle text to translate
          targetLanguage: Target language
          webTitle: Webpage title
          webDescription: Webpage description from page metadata
          videoSummary: Video summary (requires AI smart context)
    subtitlesQueue:
      title: Subtitle queue
      description: How fast subtitle requests go out and how many lines each carries
      manageQueue: Manage queue
      requestQueueConfig:
        title: Translation rate
        capacity:
          description: "Maximum burst requests: how many can go out at once"
        rate:
          description: "Requests per second: the steady pace after a burst. Decimals work, so 0.25 sends one request every 4 seconds"
      batchQueueConfig:
        title: Batch translation
        description: Configure character limits and maximum subtitle line count for batch translation (only effective for LLM translation)
        maxCharactersPerBatch:
          description: "Maximum characters: how much text one AI request carries"
        maxItemsPerBatch:
          description: "Maximum subtitle lines: how many lines share one request. Providers that are not AI ignore both"
    cache:
      title: Cache
      clearCache:
        title: Clear AI segmentation cache
        description: Segmentation results kept so a video you have already watched is not cut again
        clearing: Clearing...
        dialog:
          title: Clear AI segmentation cache
          trigger: Clear cache
          confirm: Confirm
          cancel: Cancel
          description: This will delete all cached AI segmentation results. The next time you play a video with AI segmentation enabled, it will re-process the subtitles.
